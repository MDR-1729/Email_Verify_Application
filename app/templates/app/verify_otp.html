{% extends 'app/base.html' %}

{% block title %} Verify Your Email {% endblock %}

{% block content %}
<div class="flow-label">
    <span>EMAIL VERIFICATION</span>
    <span class="flow-count">02 / 02</span>
</div>

<div class="content-heading">
    <p class="eyebrow">CHECK YOUR INBOX</p>
    <h1>Enter your<br><span>six-digit code.</span></h1>
    <p class="lead">We sent a code to <strong class="email-destination">{{ email }}</strong>.</p>
</div>

<form class="auth-form" method="post">
    {% csrf_token %}
    <div class="field-group">
        <label for="otp">Verification code</label>
        <input type="text" id="otp" name="user_otp" placeholder="000000" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" aria-describedby="otp-hint" required autofocus>
        <span class="field-hint" id="otp-hint">Enter all six digits.</span>
    </div>
    <button class="primary-button" type="submit">
        <span>Verify and continue</span>
        <span class="button-arrow" aria-hidden="true">&#8599;</span>
    </button>
</form>

<a class="text-link" href="{% url 'login' %}">Use a different email <span aria-hidden="true">&#8594;</span></a>
{% endblock %}
